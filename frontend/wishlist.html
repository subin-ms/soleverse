<!DOCTYPE html>
<html lang="en">

<head>
    <script src="js/config.js"></script>
    <script src="js/user-protected.js"></script>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wishlist - Soleverse</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/footer.css">

    <style>
        /* RESET & VARIABLES */
        :root {
            --primary-black: #000000;
            --primary-white: #ffffff;
            --text-grey: #757575;
            --border-color: #e5e5e5;
            --bg-light: #f9f9f9;
            --font-main: 'Inter', sans-serif;
            --container-width: 1170px;
            /* Closest to screenshot width */
            --padding-x: 20px;
            --accent-red: #db4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-main);
            color: var(--primary-black);
            background-color: var(--primary-white);
            line-height: 1.5;
            overflow-x: hidden;
        }

        a {
            text-decoration: none;
            color: inherit;
            transition: 0.3s;
        }

        ul {
            list-style: none;
        }

        img {
            max-width: 100%;
            display: block;
        }

        button {
            cursor: pointer;
            border: none;
            background: none;
            font-family: inherit;
        }

        .container {
            max-width: var(--container-width);
            margin: 0 auto;
            padding: 0 var(--padding-x);
        }

        /* Wishlist Active State */
        .icon-wishlist-active {
            color: var(--accent-red);
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            width: 32px;
            height: 32px;
        }

        .icon-wishlist-active i {
            font-weight: 900;
            /* Solid heart */
        }

        .mobile-toggle {
            display: none;
            font-size: 24px;
            cursor: pointer;
        }

        /* Wishlist Count Badge */
        .icon-item {
            position: relative;
        }

        .badge-count {
            position: absolute;
            top: -5px;
            right: -5px;
            background: var(--accent-red);
            color: white;
            font-size: 10px;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 400;
        }


        /* 3. WISHLIST SECTION */
        .wishlist-wrapper {
            margin-top: 80px;
            margin-bottom: 140px;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 60px;
        }

        .section-title {
            font-size: 20px;
            font-weight: 400;
        }

        .section-title-just-for-you {
            font-size: 20px;
            font-weight: 400;
            position: relative;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .section-title-just-for-you::before {
            content: '';
            display: block;
            width: 20px;
            height: 40px;
            background-color: var(--accent-red);
            border-radius: 4px;
            margin-left: -4px;
        }

        .btn-outline {
            border: 1px solid rgba(0, 0, 0, 0.1);
            padding: 16px 48px;
            font-size: 16px;
            font-weight: 500;
            background: transparent;
            border-radius: 4px;
            transition: 0.3s;
        }

        .btn-outline:hover {
            background: #f5f5f5;
        }

        /* CARD GRID */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 30px;
        }

        .wishlist-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 30px;
        }

        /* PRODUCT CARD */
        .product-card {
            position: relative;
            background: transparent;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 8px;
        }

        .product-card:hover {
            transform: translateY(-10px);
        }

        .card-image {
            width: 100%;
            aspect-ratio: 1;
            background-color: transparent;
            border-radius: 4px;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
            transition: all 0.4s ease;
        }

        .product-card:hover .card-image {
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
        }

        .card-image img {
            mix-blend-mode: multiply;
            max-width: 85%;
            max-height: 85%;
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .product-card:hover .card-image img {
            transform: scale(1.1);
        }

        .card-actions-top {
            position: absolute;
            top: 12px;
            right: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 10;
        }

        .icon-action {
            width: 34px;
            height: 34px;
            background: #fff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
            color: #000;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .icon-action:hover {
            color: var(--accent-red);
            background: #fff;
            transform: scale(1.1);
        }

        .add-to-cart-btn {
            position: absolute;
            bottom: 0px;
            left: 0;
            width: 100%;
            background: #000;
            color: #fff;
            border: none;
            height: 48px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transform: translateY(100%);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-transform: uppercase;
            line-height: 1;
            z-index: 10;
        }

        .card-image:hover .add-to-cart-btn {
            transform: translateY(0);
        }

        .card-details {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 0 4px;
        }

        .product-name {
            font-size: 16px;
            font-weight: 500;
            white-space: normal !important;
            min-height: 48px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            transition: color 0.3s ease;
        }

        .product-card:hover .product-name {
            color: var(--accent-red);
        }

        .product-price {
            font-size: 16px;
            font-weight: 600;
            color: var(--accent-red);
        }

        .price-section {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .old-price {
            color: var(--text-grey);
            text-decoration: line-through;
            font-weight: 400;
            font-size: 14px;
        }

        .rating-box {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: #FFAD33;
        }

        .review-count {
            color: rgba(0, 0, 0, 0.5);
            font-weight: 600;
        }

        /* 4. JUST FOR YOU SECTION */
        .just-for-you-wrapper {
            margin-bottom: 140px;
        }

        /* DISCOUNT BADGE */
        .discount-badge {
            position: absolute;
            top: 12px;
            left: 12px;
            background: var(--accent-red);
            color: #fff;
            padding: 4px 12px;
            font-size: 12px;
            border-radius: 4px;
            z-index: 10;
        }

        .new-badge {
            position: absolute;
            top: 12px;
            left: 12px;
            background: #00D348;
            color: #fff;
            padding: 4px 12px;
            font-size: 12px;
            border-radius: 4px;
            z-index: 10;
        }


        /* 5. FOOTER */
        footer {
            background: #000;
            color: #fff;
            padding: 80px 0 24px;
        }

        .footer-grid {
            display: grid;
            grid-template-columns: 1.5fr 1fr 1fr 1fr 1.2fr;
            gap: 87px;
            margin-bottom: 60px;
        }

        .f-col h3 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 24px;
        }

        .f-col h4 {
            font-size: 20px;
            font-weight: 500;
            margin-bottom: 24px;
        }

        .f-col ul li {
            margin-bottom: 16px;
            font-size: 16px;
            color: #FAFAFA;
        }

        .footer-bottom {
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            padding-top: 16px;
            text-align: center;
            font-size: 16px;
            color: rgba(255, 255, 255, 0.4);
        }

        .social-links {
            display: flex;
            gap: 24px;
            margin-top: 24px;
        }

        .social-links a {
            font-size: 24px;
        }

        /* RESPONSIVE BREAKPOINTS */
        @media (max-width: 1199px) {
            .container {
                max-width: 100%;
                padding: 0 40px;
            }
            .card-grid, .wishlist-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .footer-grid {
                grid-template-columns: 1fr 1fr;
                gap: 40px;
            }
        }

        @media (max-width: 767px) {
            .container {
                padding: 0 16px !important;
            }
            .wishlist-wrapper {
                margin-top: 20px !important;
                margin-bottom: 60px !important;
            }
            .card-grid, .wishlist-grid {
                grid-template-columns: 1fr !important;
                gap: 20px !important;
            }
            .footer-grid {
                display: flex !important;
                flex-direction: column;
            }
        }
    </style>
    <link rel="icon" href="img/logo.png" type="image/png">
</head>

<body>

    <div id="global-header"></div>

    <div class="main-content">
        <div class="container wishlist-wrapper">
            <div class="section-header">
                <h2 class="section-title">Wishlist</h2>
            </div>
            <div class="wishlist-grid" id="wishlistGrid">
                <!-- Dynamic Content -->
            </div>
        </div>

        <div class="container just-for-you-wrapper">
            <div class="section-header">
                <h2 class="section-title-just-for-you">Related Items</h2>
                <button class="btn-outline" onclick="window.location.href='shop.html'">See All</button>
            </div>
            <div class="wishlist-grid" id="recommendationsGrid">
                <!-- Dynamic recommendations will be loaded here -->
            </div>
        </div>
    </div>

    <div id="footer-placeholder"></div>

    <script src="js/wishlist.js"></script>
    <script src="js/products.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/footer.js"></script>
    <script src="js/header.js" defer></script>
</body>

</html>
