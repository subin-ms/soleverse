<!DOCTYPE html>
<html lang="en">
<head>
    <script src="js/config.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Soleverse</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="css/auth.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="icon" href="img/logo.png" type="image/png">
</head>
<body>

    <div class="split-layout">
        <!-- 🎨 LEFT SIDE (DESIGN) -->
        <div class="split-left">
            <div class="blob shape-olive"></div>
            <div class="blob shape-beige"></div>
            <div class="blob shape-brown"></div>
            <div class="logo-center">Soleverse</div>
        </div>

        <!-- 🧾 RIGHT SIDE (FORM) -->
        <div class="split-right">
            <div class="form-container">
                <h1>Create your Free Account</h1>
                <p>Enter your details below</p>

                <form id="signupForm">
                    <div class="form-group">
                        <input type="text" id="signupName" class="form-input" placeholder="Full Name" required>
                    </div>
                    <div class="form-group">
                        <input type="text" id="signupEmail" class="form-input" placeholder="Email or Phone Number" required>
                    </div>
                    <div class="form-group">
                        <input type="password" id="signupPassword" class="form-input" placeholder="Password" required>
                    </div>

                    <button type="submit" class="btn-submit">Create Account</button>

                    <div class="divider"><span>OR</span></div>
                    
                    <button type="button" class="btn-google">
                        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
                        Sign up with Google
                    </button>

                    <div class="form-footer">
                        <span>Already have account? <a href="login.html" class="link-red">Log in</a></span>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        // 1. CLEAR EXISTING SESSION ON SIGNUP LOAD (To ensure fresh signup)
        localStorage.removeItem('token');
        localStorage.removeItem('currentUser');
        localStorage.removeItem('isLoggedIn');
        console.log('Session cleared for new signup.');

        const form = document.getElementById("signupForm");
        const submitBtn = form.querySelector(".btn-submit");

        form.addEventListener("submit", async (e) => {
            e.preventDefault();

            submitBtn.disabled = true;
            submitBtn.innerText = "Sending OTP...";

            const name = document.getElementById("signupName").value.trim();
            const email = document.getElementById("signupEmail").value.trim();
            const password = document.getElementById("signupPassword").value.trim();

            try {
                const res = await fetch(`${API_BASE}/auth/register`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ name, email, password })
                });

                const data = await res.json();

                if (!res.ok) {
                    Swal.fire("Signup Failed", data.message, "error");
                    submitBtn.disabled = false;
                    submitBtn.innerText = "Create Account";
                    return;
                }

                openOtpModal(name, email, password);

            } catch (err) {
                Swal.fire("Error", "Server not reachable", "error");
                submitBtn.disabled = false;
                submitBtn.innerText = "Create Account";
            }
        });

        function openOtpModal(name, email, password) {
            let timerInterval;
            Swal.fire({
                title: "Verify OTP",
                text: "Enter the 6-digit OTP sent to your email",
                input: "text",
                inputPlaceholder: "123456",
                inputAttributes: {
                    maxlength: 6,
                    autocapitalize: "off",
                    autocorrect: "off"
                },
                footer: `<div id="otp-timer-container" style="font-size:14px; text-align:center;">
                            <span id="otp-timer-text" style="color:#666;">Resend OTP in <strong id="otp-countdown">60</strong>s</span>
                            <a id="resend-otp-btn" href="javascript:void(0)" style="display:none; color:var(--primary-blue); font-weight:600; text-decoration:none;">Resend OTP</a>
                         </div>`,
                didOpen: () => {
                    let timeLeft = 60;
                    const countdownEl = document.getElementById('otp-countdown');
                    const timerText = document.getElementById('otp-timer-text');
                    const resendBtn = document.getElementById('resend-otp-btn');

                    const startTimer = () => {
                        timeLeft = 60;
                        timerText.style.display = 'inline';
                        resendBtn.style.display = 'none';
                        countdownEl.innerText = timeLeft;
                        
                        clearInterval(timerInterval);
                        timerInterval = setInterval(() => {
                            timeLeft--;
                            countdownEl.innerText = timeLeft;
                            if (timeLeft <= 0) {
                                clearInterval(timerInterval);
                                timerText.style.display = 'none';
                                resendBtn.style.display = 'inline';
                            }
                        }, 1000);
                    };

                    startTimer();

                    resendBtn.addEventListener('click', async () => {
                        resendBtn.innerText = "Sending...";
                        resendBtn.style.pointerEvents = "none";
                        try {
                            const res = await fetch(`${API_BASE}/auth/register`, {
                                method: "POST",
                                headers: { "Content-Type": "application/json" },
                                body: JSON.stringify({ name, email, password })
                            });
                            if (res.ok) {
                                resendBtn.innerText = "Resend OTP";
                                resendBtn.style.pointerEvents = "auto";
                                startTimer();
                            } else {
                                Swal.showValidationMessage("Failed to resend OTP");
                                resendBtn.innerText = "Resend OTP";
                                resendBtn.style.pointerEvents = "auto";
                            }
                        } catch (err) {
                            Swal.showValidationMessage("Network error");
                            resendBtn.innerText = "Resend OTP";
                            resendBtn.style.pointerEvents = "auto";
                        }
                    });
                },
                willClose: () => {
                    clearInterval(timerInterval);
                },
                confirmButtonText: "Verify",
                showCancelButton: false,
                allowOutsideClick: false,
                preConfirm: async (otp) => {
                    if (!otp || otp.length !== 6) {
                        Swal.showValidationMessage("Please enter a valid 6-digit OTP");
                        return false;
                    }

                    try {
                        const res = await fetch(`${API_BASE}/auth/verify-otp`, {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({ email, otp })
                        });

                        const data = await res.json();

                        if (!res.ok) {
                            Swal.showValidationMessage(data.message);
                            return false;
                        }

                        return data;

                    } catch (err) {
                        Swal.showValidationMessage("Server error");
                        return false;
                    }
                }
            }).then((result) => {
                if (result.isConfirmed) {
                    Swal.fire(
                        "Success",
                        "Account verified successfully!",
                        "success"
                    ).then(() => {
                        window.location.href = "login.html";
                    });
                }
            });
        }
    </script>
</body>
</html>
